name: Scheduled Resource Monitor

on:
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      force_update:
        description: "Force trigger the coding agent even if no changes detected"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  monitor:
    name: Check external resources for changes
    runs-on: ubuntu-latest
    outputs:
      changes_detected: ${{ steps.check.outputs.changes_detected }}
      changed_sources: ${{ steps.check.outputs.changed_sources }}
      change_details: ${{ steps.check.outputs.change_details }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore hash store from cache
        uses: actions/cache@v4
        with:
          path: .github/resource-monitor/hashes.json
          key: resource-hashes-${{ github.sha }}
          restore-keys: |
            resource-hashes-

      - name: Check sources for changes
        id: check
        run: |
          chmod +x .github/resource-monitor/check-sources.sh
          .github/resource-monitor/check-sources.sh

      - name: Save hash store to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .github/resource-monitor/hashes.json
          key: resource-hashes-${{ github.sha }}-${{ github.run_id }}

  trigger-copilot:
    name: Create issue to trigger Copilot coding agent
    needs: monitor
    if: needs.monitor.outputs.changes_detected == 'true' || github.event.inputs.force_update == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Create issue to trigger coding agent
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          CHANGE_DETAILS="${{ needs.monitor.outputs.change_details }}"
          CHANGED_SOURCES="${{ needs.monitor.outputs.changed_sources }}"

          ISSUE_URL=$(gh issue create \
            --repo "${{ github.repository }}" \
            --title "chore: update codebase for regulatory resource changes — ${CHANGED_SOURCES}" \
            --body "$(cat <<EOF
          ## Context

          The scheduled resource monitor detected changes in the following external regulatory sources:

          ${CHANGE_DETAILS}

          ## Task

          Update this codebase to reflect the latest regulatory changes:

          1. Fetch the latest content from each changed source URL listed above
          2. Compare against our current documentation in \`docs/reference/aml-domain-knowledge.md\`
          3. Update the relevant files:
             - \`docs/reference/aml-domain-knowledge.md\` — new terms, thresholds, or requirements
             - \`lib/types.ts\` — TypeScript types if data models need changes
             - \`lib/validations.ts\` — Zod schemas if business rules changed
          4. For changes that require human judgment, add a \`// TODO(compliance-review):\` comment
          5. Do NOT break existing functionality — only additive or documentation changes
          6. Run \`npm test\` to verify nothing breaks

          ## Constraints

          - Be precise and conservative — regulatory compliance changes must be accurate
          - If unsure about a change, add a TODO comment rather than making the change
          - Do not modify database schema without explicit TODO marker for manual review
          - Follow existing code style (see \`.github/copilot-instructions.md\`)

          ## Acceptance Criteria

          - [ ] All changed regulatory sources are reflected in documentation
          - [ ] TypeScript types updated if needed
          - [ ] Validation schemas updated if needed
          - [ ] All existing tests pass (\`npm test\`)
          - [ ] No hardcoded values — use constants
          - [ ] TODO comments added for changes requiring compliance officer review
          EOF
          )")

          echo "Issue created: $ISSUE_URL"
          echo "The regulatory-update-agent workflow will auto-assign Copilot coding agent."
