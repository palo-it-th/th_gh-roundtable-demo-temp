name: Scheduled Resource Monitor

on:
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      force_update:
        description: "Force trigger the coding agent even if no changes detected"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  monitor:
    name: Check external resources for changes
    runs-on: ubuntu-latest
    outputs:
      changes_detected: ${{ steps.check.outputs.changes_detected }}
      changed_sources: ${{ steps.check.outputs.changed_sources }}
      change_details: ${{ steps.check.outputs.change_details }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore hash store from cache
        uses: actions/cache@v4
        with:
          path: .github/resource-monitor/hashes.json
          key: resource-hashes-${{ github.sha }}
          restore-keys: |
            resource-hashes-

      - name: Check sources for changes
        id: check
        run: |
          chmod +x .github/resource-monitor/check-sources.sh
          .github/resource-monitor/check-sources.sh

      - name: Save hash store to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .github/resource-monitor/hashes.json
          key: resource-hashes-${{ github.sha }}-${{ github.run_id }}

  coding-agent:
    name: Run coding agent to update codebase
    needs: monitor
    if: needs.monitor.outputs.changes_detected == 'true' || github.event.inputs.force_update == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Create update branch
        id: branch
        run: |
          BRANCH_NAME="auto-update/regulatory-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code to update codebase
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "You are a compliance engineering agent. External regulatory resources that this project depends on have changed.

          ## Changed Resources
          ${{ needs.monitor.outputs.change_details }}

          ## Your Task
          1. Fetch the latest content from each changed source URL above
          2. Analyze what specifically changed compared to our current documentation
          3. Update the relevant files in this codebase to reflect the new regulatory requirements
          4. Focus on:
             - Updating docs/reference/aml-domain-knowledge.md with any new terms, thresholds, or requirements
             - Updating TypeScript types/interfaces in lib/types.ts if data models need changes
             - Updating validation schemas in lib/validations.ts if business rules changed
             - Adding TODO(compliance-review) comments for changes that require manual review
          5. Do NOT break existing functionality — only additive or documentation changes
          6. If unsure about a change, add a clearly marked TODO comment rather than making the change
          7. Run the tests with: npm test

          Changed source IDs: ${{ needs.monitor.outputs.changed_sources }}

          Be precise and conservative. Regulatory compliance changes must be accurate." --allowedTools "Edit,Write,Read,Bash,WebFetch"

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$(cat <<'EOF'
          chore: auto-update from regulatory resource changes

          Detected changes in monitored external resources:
          ${{ needs.monitor.outputs.changed_sources }}

          This commit was automatically generated by the resource monitoring agent.
          Manual review is required before merging.
          EOF
          )"
          git push origin "${{ steps.branch.outputs.branch_name }}"

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          PR_URL=$(gh pr create \
            --title "chore: regulatory resource update — ${{ needs.monitor.outputs.changed_sources }}" \
            --body "$(cat <<'EOF'
          ## Summary

          The scheduled resource monitor detected changes in the following external sources:

          ${{ needs.monitor.outputs.change_details }}

          ## What was updated

          The coding agent analyzed the changes and updated relevant files. See the diff for details.

          ## Review checklist

          - [ ] Verify regulatory content accuracy against the source URLs
          - [ ] Check that no existing functionality was broken
          - [ ] Review any TODO comments added by the agent
          - [ ] Confirm type/schema changes are backwards-compatible
          - [ ] Run tests locally: `npm test`

          ## Important

          ⚠️ **This PR was auto-generated.** A compliance officer must review before merging.

          ---
          🤖 Generated by the Resource Monitor Agent
          EOF
          )" \
            --base main)
          echo "PR created: $PR_URL"

  create-tracking-issue:
    name: Create tracking issue
    needs: [monitor, coding-agent]
    if: always() && (needs.monitor.outputs.changes_detected == 'true' || github.event.inputs.force_update == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Create issue for tracking
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          CHANGE_DETAILS="${{ needs.monitor.outputs.change_details }}"
          CHANGED_SOURCES="${{ needs.monitor.outputs.changed_sources }}"
          AGENT_STATUS="${{ needs.coding-agent.result }}"

          if [ "$AGENT_STATUS" = "success" ]; then
            STATUS_MSG="✅ Coding agent ran successfully and opened a PR. Please review."
          else
            STATUS_MSG="⚠️ Coding agent failed or was skipped. Manual update may be required."
          fi

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "chore: regulatory resource change detected — ${CHANGED_SOURCES}" \
            --body "$(cat <<EOF
          ## Status

          ${STATUS_MSG}

          ## Changed Resources

          ${CHANGE_DETAILS}

          ## Files to review

          - \`docs/reference/aml-domain-knowledge.md\`
          - \`lib/types.ts\`
          - \`lib/validations.ts\`

          ---
          🤖 Auto-created by Resource Monitor workflow
          EOF
          )"
